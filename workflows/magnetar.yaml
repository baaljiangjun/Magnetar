name: magnetar-cv610
target: Hi3516CV610
stages:
  - INIT
  - ACQUIRE
  - EXPORT
  - TOOLCHAIN
  - COMPILE
  - SIMULATE
  - SDK-GEN
  - RUNONBOARD
  - PACKAGE
  - PUBLISH
artifacts:
  onnx: export/model.onnx
  metadata: export/model_meta.json
  om: compile/model.om
  atc_command: compile/atc_command.txt
  simulation: simulate/simulate_report.md
  package: package/
gates:
  - static_onnx
  - atc_available
  - mindcmd_available
  - cross_compiler_available
  - om_generated
  - simulation_accepted
  - publish_confirmed
optional:
  - RUNONBOARD
